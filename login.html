<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Modern Convent School
    </title>

    <link
        rel="stylesheet"
        href="css/site.css"
    >

</head>


<body>


    <div data-header></div>


    <section class="page-hero">

        <div class="container">

            <div class="breadcrumb">

                <a href="index.html">
                    Home
                </a>

                /

                Login

            </div>


            <h1>
                School Portal Login
            </h1>

        </div>

    </section>


    <section class="section">

        <div
            class="container"
            style="max-width:520px"
        >

            <div class="card">

                <h2>
                    Sign in
                </h2>


                <p
                    style="
                        color:#6b7b8c;
                        margin-bottom:20px;
                    "
                >
                    Sign in using your school account.
                </p>


                <form
                    id="loginForm"
                    class="form"
                >


                    <label for="username">
                        Username
                    </label>


                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        required
                        placeholder="Enter username"
                    >


                    <label for="password">
                        Password
                    </label>


                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        placeholder="Enter password"
                    >


                    <button
                        id="loginButton"
                        type="submit"
                        class="btn"
                    >
                        Login
                    </button>


                    <div
                        id="loginMessage"
                        style="
                            display:none;
                            margin-top:15px;
                            padding:12px;
                            border-radius:6px;
                            background:#fff1f1;
                            color:#b42318;
                        "
                    ></div>


                </form>


                <p
                    style="
                        color:#6b7b8c;
                        margin-top:20px;
                        font-size:14px;
                    "
                >
                    If you do not have an account,
                    please contact the school administrator.
                </p>

            </div>

        </div>

    </section>


    <div data-footer></div>


    <!-- IMPORTANT: CONFIG FIRST -->

    <script src="js/Config.js"></script>

    <!-- API SECOND -->

    <script src="js/api.js"></script>

    <!-- COMMON WEBSITE JS -->

    <script src="js/app.js"></script>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const button =
                        document
                            .getElementById("loginButton");


                    const message =
                        document
                            .getElementById("loginMessage");


                    message.style.display =
                        "none";

                    message.textContent =
                        "";


                    if (!username) {

                        showMessage(
                            "Please enter your username."
                        );

                        return;
                    }


                    if (!password) {

                        showMessage(
                            "Please enter your password."
                        );

                        return;
                    }


                    if (!MCSApi.configured()) {

                        showMessage(
                            "API URL is not configured in js/Config.js."
                        );

                        return;
                    }


                    button.disabled = true;

                    button.textContent =
                        "Signing in...";


                    try {

                        /*
                         * IMPORTANT
                         *
                         * The backend expects:
                         *
                         * username
                         * password
                         */

                        const result =
                            await MCSApi.post(
                                "login",
                                {
                                    username:
                                        username,

                                    password:
                                        password
                                }
                            );


                        console.log(
                            "Login successful:",
                            result
                        );


                        /*
                         * Code.gs returns:
                         *
                         * {
                         *     session: {...},
                         *     user: {...}
                         * }
                         */

                        const session =
                            result.session;


                        const user =
                            result.user;


                        if (
                            !session ||
                            !session.token
                        ) {

                            throw new Error(
                                "Login succeeded but no session was returned."
                            );
                        }


                        /*
                         * Store ONLY the login session.
                         *
                         * No student/teacher/fee/etc.
                         * data is stored here.
                         */

                        sessionStorage.setItem(
                            "MCS_SESSION",
                            JSON.stringify(
                                session
                            )
                        );


                        const role =
                            String(
                                user?.role ||
                                session.role ||
                                ""
                            )
                            .toLowerCase();


                        /*
                         * Redirect according
                         * to server-provided role.
                         */

                        if (
                            role === "admin" ||
                            role === "super_admin"
                        ) {

                            window.location.href =
                                "admin/dashboard.html";

                            return;
                        }


                        if (
                            role === "teacher" ||
                            role === "staff" ||
                            role === "accountant"
                        ) {

                            window.location.href =
                                "portal/teacher.html";

                            return;
                        }


                        if (
                            role === "student" ||
                            role === "parent"
                        ) {

                            window.location.href =
                                "portal/dashboard.html";

                            return;
                        }


                        throw new Error(
                            "Unsupported user role: " +
                            role
                        );

                    }


                    catch (error) {

                        console.error(
                            "LOGIN ERROR:",
                            error
                        );


                        showMessage(
                            error.message ||
                            "Login failed."
                        );

                    }


                    finally {

                        button.disabled =
                            false;

                        button.textContent =
                            "Login";

                    }

                }
            );


        function showMessage(text) {

            const element =
                document.getElementById(
                    "loginMessage"
                );


            element.textContent =
                text;


            element.style.display =
                "block";
        }

    </script>


</body>

</html>
