<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Modern Convent School</title><link rel="stylesheet" href="css/site.css"></head><body><div data-header></div><section class="page-hero"><div class="container"><div class="breadcrumb"><a href="index.html">Home</a> / Login</div><h1>School Portal Login</h1></div></section><section class="section"><div class="container" style="max-width:520px"><div class="card"><h2>Sign in</h2><form id="loginForm" class="form"><input id="user" required placeholder="User ID"><input id="pass" type="password" required placeholder="Password"><select id="role"><option value="student">Student / Parent</option><option value="teacher">Teacher</option><option value="admin">Administrator</option></select><button class="btn">Login</button></form><p style="color:#6b7b8c">Demo accounts are documented in README.md. Replace demo authentication with the deployed Apps Script backend before production use.</p></div></div></section><script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const role=document.getElementById('role').value;const user=document.getElementById('user').value;const pass=document.getElementById('pass').value;
const demo=(user==='admin'&&pass==='admin123')||(user==='teacher'&&pass==='teacher123')||(user==='student'&&pass==='student123');
if(demo){location.href=role==='admin'?'/admin/dashboard.html':role==='teacher'?'/portal/teacher.html':'/portal/dashboard.html';return;}
const r=await api('login',{user,password:pass,role}); if(r.ok){location.href=role==='admin'?'/admin/dashboard.html':role==='teacher'?'/portal/teacher.html':'/portal/dashboard.html';}else alert(r.message||'Login failed');
});
</script><div data-footer></div><script src="js/app.js"></script></body></html>
